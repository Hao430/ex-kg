# CI/CD：门禁 + 生产部署 + 一键回退
#
# 流程：push/PR main → ci（tsc/测试/arch/build/PG 冒烟 ×2，自动）→
#   - 部署：Actions 页手动 Run workflow（留空 rollback_snapshot）→
#     备份快照 → rsync → 依赖预检 → **部署期迁移（失败即中止，不重启）** → 重启 → 验收
#   - 回退：手动 Run workflow 填 rollback_snapshot → 执行部署手册 §5
#
# 人工放行 = 手动触发（私有仓库 Free 套餐无 Environment Required reviewers，
# 见部署手册 §11）；部署目标与全部命令口径来自 docs/部署与回退手册.md。
# 所需 Secrets：DEPLOY_HOST / DEPLOY_PORT / DEPLOY_USER / DEPLOY_SSH_KEY /
#   DATABASE_ADMIN_URL（owner 凭据，仅「部署期迁移」步骤使用，即用即删——ADR-0019）
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_snapshot:
        description: '回退目标快照（如 20260910_1447）。留空 = 走正常部署'
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ORIGIN: https://kg.hao430.cn
  SITE_DIR: /www/wwwroot/ex-kg
  RELEASES_DIR: /www/ex-kg.releases
  # 服务端 node/npm 路径不再写死版本号：宝塔升级 Node 会更换 /www/server/nodejs/vX.Y.Z 目录，
  # 写死曾致部署在依赖安装步 127 失败（2026-10-24）。各部署步骤在远端动态解析最新版本目录。

jobs:
  ci:
    # 纯回退触发时不跑 CI（快照是已验收产物，无需再验）
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rollback_snapshot != '') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arborize_test
        ports:
          - '5433:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d arborize_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（tsc --noEmit）
        run: npm run lint

      - name: 全量测试（默认套件，内存模式）
        run: npm test

      - name: 架构守护测试（双模纪律 / 限流器纪律）
        run: npx tsx --test 'arch-tests/*.test.mjs'

      - name: 构建（vite build + esbuild 打包后端）
        run: npm run build

      # --test-concurrency=1：这 12 个文件共用同一个库，且各自在 before() 里跑一遍迁移
      # （DDL 取 ACCESS EXCLUSIVE 锁）。并行迁移只会互相等锁，首轮还可能因 5s 语句超时
      # 把迁移打成 return false——那是排障噪声，不是被测行为。串行跑让失败可归因。
      #
      # ⚠️ 每个起HTTP server 的用例文件都必须在 after() 里server.close()：漏掉会让
      # node:test 的事件循环永不空闲（进程不退出），本步骤无限挂起直到 GitHub 的
      # 6 小时 job 上限（2026-09-16 起曾连续三次 5h58m 挂死，根因是
      # tests/pg/canvas-search.pg.test.ts 缺失清理）。加测试文件时照既有文件抄这段。
      - name: PG 真库冒烟（tests/pg/*.test.ts，PG_SMOKE 门控）
        run: PG_SMOKE=1 npx tsx --test --test-concurrency=1 'tests/pg/*.test.ts'

      # ADR-0019 的关键一验：同一套 PG 冒烟以**双角色**再跑一遍。
      # 第一遍（上一步）是 owner 单角色，只覆盖既有行为；这一遍以 app（受 RLS）为主
      # 角色，是唯一能证明「每个 PG 路径都带上了作用域」「每条策略都放行得通」的检验，
      # 也是生产翻 DATABASE_URL 开关的唯一依据。
      #
      # ⚠️ 这一遍必须跑在**自己的空库**（arborize_rls_test）上，不能复用第一遍的
      # arborize_test：PG 冒烟用例注册的是**固定邮箱**（j3-*/p-pg-*），复用已写过的库
      # 会在 send-register-code 撞 EMAIL_EXISTS(409)——表现为「应发出验证码邮件」失败，
      # 而真因在测试夹具而非被测行为。「PG 冒烟必须空库跑」是既有硬约束（部署手册 §8.3），
      # 这里用独立库来满足它，而不是放宽用例。
      - name: 建 PG 冒烟角色（app / system）并授权（两个库）
        run: |
          set -e
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE arborize_app LOGIN PASSWORD 'app_pw';
          CREATE ROLE arborize_system LOGIN PASSWORD 'system_pw';
          -- BYPASSRLS 需超级用户；CI 的 postgres 即超级用户（生产见 ADR-0019 的退路）
          ALTER ROLE arborize_system BYPASSRLS;
          -- 双角色轮专用空库（用例自带 createApp + initDbSchema，会自己建表）
          CREATE DATABASE arborize_rls_test;
          SQL

          # 角色是集群级的，库级授权两个库都要做一遍。
          # ALTER DEFAULT PRIVILEGES 按**库**存储，且必须在建表之前生效——
          # 否则后续迁移新建的表对 app 角色不可见（表现为「表不存在」）。
          cat > /tmp/pg-smoke-grants.sql <<'SQL'
          GRANT USAGE ON SCHEMA public TO arborize_app, arborize_system;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO arborize_app, arborize_system;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO arborize_app, arborize_system;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO arborize_app, arborize_system;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO arborize_app, arborize_system;
          SQL
          for DB in arborize_test arborize_rls_test; do
            echo "授权 $DB"
            PGPASSWORD=postgres psql -h 127.0.0.1 -p 5433 -U postgres -d "$DB" \
              -v ON_ERROR_STOP=1 -f /tmp/pg-smoke-grants.sql
          done
          echo "双角色已就绪（arborize_test / arborize_rls_test）"

      - name: PG 真库冒烟（双角色：app 受 RLS + system 跨租户，ADR-0019）
        env:
          PG_TEST_URL: postgres://arborize_app:app_pw@127.0.0.1:5433/arborize_rls_test
          DATABASE_SYSTEM_URL: postgres://arborize_system:system_pw@127.0.0.1:5433/arborize_rls_test
          # 迁移类用例（initDbSchema）仍以 owner 执行——生产里这一步在部署期 migrate 步骤，
          # CI 里 NODE_ENV 非 production，故 checkRuntimeDbRoleInvariants 不介入
          DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5433/arborize_rls_test
        run: PG_SMOKE=1 npx tsx --test --test-concurrency=1 'tests/pg/*.test.ts'

      # 测试通过的构建物即发布物（不经本地二次构建）
      - name: 上传 dist 构建物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  deploy:
    name: 部署到生产（手动触发）
    needs: ci
    # 仅手动 Run workflow（回退输入留空）时执行——push 只跑门禁，不自动发版
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_snapshot == '' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4   # 取 package.json / package-lock.json（供服务端依赖安装）

      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: 写入 SSH 私钥
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 备份线上产物 + 数据库（铁律：不备份不发布）
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          TS=$(date +%Y%m%d_%H%M)
          DIR=/www/ex-kg.releases/$TS
          DB_CONTAINER=postgres-info-hub
          DB_NAME=arborize
          if [ -e "$DIR" ]; then echo "快照 $TS 已存在，拒绝覆盖"; exit 1; fi
          mkdir -p "$DIR/db"
          cp -a /www/wwwroot/ex-kg/dist "$DIR/dist"
          cp -a /www/wwwroot/ex-kg/package.json /www/wwwroot/ex-kg/package-lock.json "$DIR/" 2>/dev/null || true
          cp -a /www/wwwroot/ex-kg/index.html "$DIR/" 2>/dev/null || true

          # 数据库备份：pg-host 同机 Docker 容器（宿主 35432，库 arborize）。
          # pg_dump 失败 / gzip 损坏 → pipefail + -t 校验直接失败，绝不"无库备份"继续发布。
          docker exec "$DB_CONTAINER" pg_dump -U postgres -d "$DB_NAME" | gzip > "$DIR/db/arborize_$TS.sql.gz"
          gzip -t "$DIR/db/arborize_$TS.sql.gz"
          test -s "$DIR/db/arborize_$TS.sql.gz"

          ( cd /www/ex-kg.releases && tar czf "$TS.tar.gz" "$TS/dist" "$TS/db" )
          {
            echo '【ex-kg 回退快照】'
            echo "备份时间(服务器): $(date '+%Y-%m-%d %H:%M:%S')"
            echo '触发源: GitHub Actions CD'
            echo "源码 commit: ${{ github.sha }}"
            echo "支付开关: $(grep -m1 ^PAYMENT_ENABLED /www/wwwroot/ex-kg/.env || echo unknown)"
            echo "数据库备份: db/arborize_$TS.sql.gz ($(du -h "$DIR/db/arborize_$TS.sql.gz" | cut -f1))"
            echo "恢复命令: gunzip -c $DIR/db/arborize_$TS.sql.gz | docker exec -i $DB_CONTAINER psql -U postgres -d $DB_NAME"
          } > "$DIR/RELEASE_INFO.txt"

          # 保留最近 5 份快照（目录 + tar.gz 同步清理；DB 备份在目录内随之一并轮转）
          for old in $(find /www/ex-kg.releases -maxdepth 1 -mindepth 1 -type d -printf '%f\n' \
                       | grep -E '^[0-9]{8}_[0-9]{4}$' | sort -r | tail -n +6); do
            echo "清理旧快照 $old"
            rm -rf "/www/ex-kg.releases/$old" "/www/ex-kg.releases/$old.tar.gz"
          done

          echo "SNAPSHOT=$TS"
          REMOTE

      - name: 同步 package.json / package-lock.json（供服务端依赖安装）
        run: |
          rsync -az -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }}" \
            package.json package-lock.json \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$SITE_DIR/

      - name: 同步 dist（整体镜像，清理旧 hash 资产）
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }}" \
            dist/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$SITE_DIR/dist/

      - name: 服务端依赖安装 + 依赖预检（缺模块即停，不重启）
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' <<'REMOTE'
          set -e
          NODE_BIN_DIR="$(ls -dv /www/server/nodejs/v*/bin 2>/dev/null | tail -1)"
          [ -x "$NODE_BIN_DIR/node" ] && [ -x "$NODE_BIN_DIR/npm" ] || { echo "❌ 未在 /www/server/nodejs/v*/bin 找到可用的 node/npm"; ls /www/server/nodejs 2>/dev/null || true; exit 1; }
          echo "服务端 Node: $NODE_BIN_DIR"
          cd /www/wwwroot/ex-kg
          chown -R www:www dist package.json package-lock.json
          "$NODE_BIN_DIR/npm" install --omit=dev --no-audit --no-fund
          chown -R www:www node_modules
          # 依赖预检：server.cjs 的全部 require 必须可 resolve（手册 §3），缺模块即失败不重启
          "$NODE_BIN_DIR/node" -e "const src=require('fs').readFileSync('dist/server.cjs','utf8');const re=/require\(\"([a-z@][^\"]*)\"\)/g;const set=new Set();let m;while((m=re.exec(src)))set.add(m[1]);let bad=0;for(const n of set){try{require(n)}catch(e){console.log('MISSING',n);bad++}}if(bad){process.exit(1)}console.log('依赖齐')"
          REMOTE

      # ADR-0019：迁移是部署期的独立步骤，**在重启之前**。失败即中止且不重启——
      # 旧进程继续服务，而不是起一个半 schema 的新进程。
      # owner 凭据经 ssh **stdin** 落到远端 mode-600 临时文件（不进 argv，远端 ps 看不到），
      # 用后即删；绝不写进运行期 .env（checkRuntimeDbRoleInvariants 会拒绝带 owner 凭据启动）。
      - name: 部署期迁移（owner 凭据即用即删；失败即中止不重启）
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: |
          set -e
          if [ -z "$DATABASE_ADMIN_URL" ]; then
            echo "缺少 Secret DATABASE_ADMIN_URL：无法执行部署期迁移（ADR-0019）"; exit 1
          fi
          printf 'DATABASE_ADMIN_URL=%s\n' "$DATABASE_ADMIN_URL" | \
            ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "umask 077 && cat > ${{ env.SITE_DIR }}/.migrate.env"

          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' <<'REMOTE'
          set -e
          NODE_BIN_DIR="$(ls -dv /www/server/nodejs/v*/bin 2>/dev/null | tail -1)"
          [ -x "$NODE_BIN_DIR/node" ] || { echo "❌ 未在 /www/server/nodejs/v*/bin 找到可用的 node"; ls /www/server/nodejs 2>/dev/null || true; exit 1; }
          echo "服务端 Node: $NODE_BIN_DIR"
          cd /www/wwwroot/ex-kg
          trap 'rm -f /www/wwwroot/ex-kg/.migrate.env' EXIT
          set -a; . /www/wwwroot/ex-kg/.migrate.env; set +a
          export NODE_ENV=production
          # 迁移失败 → 中止发布（不重启，手册 §8）
          MIGRATE_OUT=$("$NODE_BIN_DIR/node" dist/migrate.cjs 2>&1) || {
            echo "$MIGRATE_OUT"
            echo "❌ 迁移失败——已中止发布，未重启进程（旧版本继续服务）"
            exit 1
          }
          echo "$MIGRATE_OUT"
          # 迁移结果必须显式校验：成功标志缺失 = 静默失败，不能放行到重启
          echo "$MIGRATE_OUT" | grep -q "verified and initialized" \
            || { echo "❌ 迁移未打印成功标志（缺日志或静默失败）"; exit 1; }
          echo "schema ok"
          REMOTE

      - name: 重启进程（手册 Step5：优雅退出 + kill -9 兜底 + su www 启动）
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' <<'REMOTE'
          set -e
          # PID 文件**可能不存在**：它只在启动时由面板脚本写出，服务崩了 / 上次启动失败 /
          # 手动误操作后它就不在——而这正是本步骤最该派上用场的场景（服务已挂，要靠部署拉回来）。
          # 原写法 `PID=$(cat ...)` 在 set -e 下于此处直接中止：kill 与 start 都没执行，
          # 第 11 步验收被 skip，表现为「CD 修不好已经挂掉的服务」（实测 2026-09-14）。
          PID_FILE=/www/server/nodejs/vhost/pids/ex_kg.pid
          PID=$(cat "$PID_FILE" 2>/dev/null || true)
          if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then
            kill "$PID"; for i in $(seq 1 40); do kill -0 "$PID" 2>/dev/null || break; sleep 0.5; done
            if kill -0 "$PID" 2>/dev/null; then kill -9 "$PID"; fi
          else
            echo "PID 文件缺失或进程已退出（PID='${PID}'），跳过终止"
          fi
          # PID 文件丢了但进程还活着（孤儿）时会占着 2998 端口，直接起会 EADDRINUSE——
          # 按端口兜底清一次。端口为本应用专用，故按端口清理是安全的。
          if command -v fuser >/dev/null 2>&1 && fuser 2998/tcp >/dev/null 2>&1; then
            echo "端口 2998 仍被占用，按端口清理孤儿进程"; fuser -k 2998/tcp || true; sleep 1
          fi
          rm -f "$PID_FILE"
          su www -s /bin/bash -c "bash /www/server/nodejs/vhost/scripts/ex_kg.sh"
          sleep 4
          NEW_PID=$(cat /www/server/nodejs/vhost/pids/ex_kg.pid)
          echo "new PID=$NEW_PID"
          tail -4 /www/wwwlogs/nodejs/ex_kg.log
          grep -q "listening on http://0.0.0.0:2998" /www/wwwlogs/nodejs/ex_kg.log \
            || { echo "启动日志未见 listening 行"; tail -30 /www/wwwlogs/nodejs/ex_kg.log; exit 1; }
          # 启动日志里不应再出现 owner 凭据不变量告警（ADR-0019）——生产已零 DDL 权限
          if grep -q "DATABASE_ADMIN_URL" /www/wwwlogs/nodejs/ex_kg.log; then
            echo "❌ 运行期进程检测到 owner 凭据（DATABASE_ADMIN_URL）——迁移凭据泄漏进 .env"
            tail -30 /www/wwwlogs/nodejs/ex_kg.log; exit 1
          fi
          # schema 迁移校验已上移到「部署期迁移」步骤：生产进程不再执行 DDL，
          # 启动日志里**不会**再有 schema 结果行（此前在此 grep 的做法已失效）。
          REMOTE

      - name: 发布验收（health / 首页 / 新 bundle）
        run: |
          set -e
          curl -fsS ${{ env.APP_ORIGIN }}/api/health > /dev/null && echo "health ok"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' ${{ env.APP_ORIGIN }}/)
          [ "$CODE" = "200" ] || { echo "首页 $CODE"; exit 1; }
          ASSET=$(curl -fsS ${{ env.APP_ORIGIN }}/ | grep -oE 'index-[^"]+\.js' | head -1)
          ACODE=$(curl -s -o /dev/null -w '%{http_code}' ${{ env.APP_ORIGIN }}/assets/$ASSET)
          [ "$ACODE" = "200" ] || { echo "新 bundle $ASSET → $ACODE"; exit 1; }
          echo "首页 200，bundle $ASSET 200 —— 验收通过"

  rollback:
    name: 回退生产（按快照）
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_snapshot != '' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: 输入格式校验（防 shell 注入）
        run: |
          [[ "${{ inputs.rollback_snapshot }}" =~ ^[0-9]{8}_[0-9]{4}$ ]] \
            || { echo "快照格式应为 YYYYMMDD_HHMM"; exit 1; }

      - name: 写入 SSH 私钥
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 校验快照存在
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "test -d ${{ env.RELEASES_DIR }}/${{ inputs.rollback_snapshot }}/dist \
              || { echo '快照不存在: ${{ inputs.rollback_snapshot }}'; ls ${{ env.RELEASES_DIR }}/; exit 1; }"

      - name: 回退（手册 §5：快照 dist 覆盖 + 重启）
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' <<'REMOTE'
          set -e
          D=${{ env.RELEASES_DIR }}/${{ inputs.rollback_snapshot }}
          rm -rf /www/wwwroot/ex-kg/dist && cp -a $D/dist /www/wwwroot/ex-kg/dist
          chown -R www:www /www/wwwroot/ex-kg/dist
          kill $(cat /www/server/nodejs/vhost/pids/ex_kg.pid); sleep 2
          su www -s /bin/bash -c "bash /www/server/nodejs/vhost/scripts/ex_kg.sh"
          sleep 4
          tail -4 /www/wwwlogs/nodejs/ex_kg.log
          REMOTE

      - name: 回退验收
        run: |
          set -e
          curl -fsS ${{ env.APP_ORIGIN }}/api/health > /dev/null && echo "health ok"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' ${{ env.APP_ORIGIN }}/)
          [ "$CODE" = "200" ] || { echo "首页 $CODE"; exit 1; }
          echo "已回退到快照 ${{ inputs.rollback_snapshot }}，验收通过"
