    <script>
      // Prevent benign ResizeObserver loop limit/undelivered notifications from bubbling as unhandled exceptions
      window.addEventListener('error', function (e) {
        if (
          e &&
          e.message &&
          (e.message.indexOf('ResizeObserver') !== -1 ||
            e.message.indexOf('resize observer') !== -1)
        ) {
          e.stopImmediatePropagation();
          if (e.preventDefault) e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e &&
          e.reason &&
          e.reason.message &&
          (e.reason.message.indexOf('ResizeObserver') !== -1 ||
            e.reason.message.indexOf('resize observer') !== -1)
        ) {
          e.stopImmediatePropagation();
          if (e.preventDefault) e.preventDefault();
          return true;
        }
      }, true);
    </script>
